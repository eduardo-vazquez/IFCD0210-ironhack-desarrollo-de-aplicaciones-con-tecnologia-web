<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personajes Favoritos</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
        <h1>Personajes Favoritos</h1>
    </header>
    <main>
        <section>
            <article>
                <figure>
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/ed/Over_Hill_-_Bilbo_and_Gandalf_by_Joel_Lee.jpg"
                        alt="Gandalf">
                    <figcaption>Gandalf</figcaption>
                    <p class="description">Es un istar, uno de los espíritus maia enviados a la Tierra Media
                        durante la Tercera Edad del Sol para ayudar a sus habitantes en la lucha contra el «señor
                        oscuro» Sauron. Allí adoptó el aspecto de un anciano de barba larga y de color blanca grisácea,
                        vestido con una gran capa gris, un sombrero puntiagudo de color azul y un gran cayado.</p>
                </figure>
            </article>
            <article>
                <figure>
                    <img src="img/captain-planet.webp"
                        alt="Captain Planet" class="caracter-image">
                    <figcaption>Captain Planet</figcaption>
                    <p class="description">Gaia, el espíritu de la Tierra, no puede resistir por más tiempo la terrible
                        destrucción que azota al planeta. Es por esto que entrega cinco anillos mágicos a jóvenes
                        especiales: Tierra, Fuego, Viento, Agua y Corazon. Cuando estos combinan sus poderes, convocan a
                        Capitan Planeta, un guerrero elemental que lucha contra la contaminación y la destrucción del
                        medio ambiente.
                    </p>
                </figure>
            </article>
            <article>
                <figure>
                    <img src="img/newt-scamander.webp" alt="Newt Scamander" class="caracter-image">
                    <figcaption>Newt Scamander</figcaption>
                    <p class="description">Es un magizoólogo británico, autor del libro "Animales fantásticos y dónde encontrarlos". Es el protagonista de la serie de películas "Animales fantásticos". Newt es conocido por su amor por las criaturas mágicas y su dedicación a protegerlas.
                    </p>
                </figure>
            </article>
            
        </section>
    </main>
</body>

</html>
