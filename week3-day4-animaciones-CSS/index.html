<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animaciones Css</title>

    <link rel="stylesheet" href="style.css">

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
</head>

<body>
    <div id="background"></div>
    <header>
        <h1>ANIMACIONES CSS</h1>
    </header>
    <main>
        <section>
            <h2>DE CUADRO A CIRCULO</h2>
            <div class="animation-container">
                <div class="cuadro"></div>
            </div>
        </section>
        <section class="animacion-pelota">
            <h2>ANIMACION PELOTA</h2>
            <div class="animation-container">
                <div id="pelota"></div>
                <div id="suelo"></div>
            </div>
        </section>
        <section class="coyote-container">
            <h2>ANIMACION ANUNCIO</h2>
            <div class="roadrunner-container">
                <img src="img/coyote.gif" alt="" class="coyote">
                <img src="img/roadrunner.gif" alt="" class="roadrunner">
            </div>
        </section>
</body>

</html>
