    <footer>

        <h4 class="contacto-title">CONTACTO</h4>
        <form action="https://formsubmit.co/4fd52dad113ce7308a9d5af908215bdd" method="POST" class="contact-form">

            <!-- Configuración de FormSubmit -->
            <input type="hidden" name="_subject" value="Nuevo mensaje desde tu Portfolio!">
            <input type="hidden" name="_captcha" value="false">

            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" name="name" id="name"  required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="message">Mensaje</label>
                <textarea name="message" maxlength="100" id="message" rows="4" 
                    required></textarea>
            </div>

            <button type="submit" class="btn-enviar">Enviar Mensaje</button>
        </form>
