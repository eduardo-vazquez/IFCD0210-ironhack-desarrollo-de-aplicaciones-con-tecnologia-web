<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Empresa</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Formulario Empresa</h1>
    </header>
    <form action="recibido.html" method="get">
        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" id="nombre" maxlength="50" required>
        </div>
        <div>
            <label for="apellido">Apellido:</label>
            <input type="text" name="apellido" id="apellido" maxlength="50" required>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email">
        </div>
        <div>
            <label for="edad">Edad:</label>
            <input type="number" name="edad" id="edad" min="18" max="120" placeholder="Edad entre 18 y 120 años">
        </div>
        <div>
            <label for="fecha">Fecha:</label>
            <input type="date" name="fecha" id="fecha">
        </div>

        <div>
            <label for="asunto">Asunto:</label>
            <input type="text" name="asunto" id="asunto" maxlength="50">
        </div>
        <div id="container-comentario">
            <label for="comentario">Comentario:</label>
            <textarea name="comentario" id="comentario" cols="30" rows="10" maxlength="150"></textarea>
        </div>
        <button type="submit">Enviar</button>
    </form>
</body>

</html>
